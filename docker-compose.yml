services:
  db:
    image: mariadb:latest
    container_name: budget-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    image: php:8.1-apache
    container_name: budget-web
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./www:/var/www/html
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db
    command: sh -c "docker-php-ext-install mysqli && apache2-foreground"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: budget-pma
    restart: always
    ports:
      - "8083:80"
    environment:
      - PMA_HOST=db
      - ARBITRARY=1
    depends_on:
      - db


  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: budget-duckdns
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      LOG_FILE: "false"


  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: budget-caddy
    restart: unless-stopped
    ports:
      - "60443:443"
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
