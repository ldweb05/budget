services:
  db:
    image: mariadb:latest
    container_name: budget-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    image: php:8.1-apache
    container_name: budget-web
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./www:/var/www/html
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db
    command: sh -c "docker-php-ext-install mysqli && apache2-foreground"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: budget-pma
    restart: always
    ports:
      - "8083:80"
    environment:
      - PMA_HOST=db
      - ARBITRARY=1
    depends_on:
      - db

volumes:
  db_data:
